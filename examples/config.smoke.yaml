data_dir: .remote-agent-hub-smoke
default_cwd: ..
agent_turn_timeout_ms: 5000
approval_timeout_ms: 20000

media:
  max_inbound_bytes: 20971520
  max_outbound_bytes: 52428800
  auto_discovery: false
  outbound_roots: []

delivery:
  full_tool_output: false
  tool_status_batch_ms: 0

users:
  smoke:
    telegram_ids: []
    wechat_ids: []
    allowed_roots:
      - ..

channels:
  fake:
    enabled: true
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    allowed_chat_ids: []
    unsafe_allow_all: false
  wechat:
    enabled: false
    allowed_chat_ids: []
    bot_type: "3"
    unsafe_allow_all: false

agents:
  pi:
    command: pi
    config_scope: hitch
    default_args:
      - --mode
      - rpc
    default_policy: ask
