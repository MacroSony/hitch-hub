data_dir: .remote-agent-hub
default_cwd: ..
agent_turn_timeout_ms: 300000
# Each distinct tool call extends the active-work budget by one minute, up to
# the maximum. Approval/input waits pause active-work accounting and use their
# own limits. Silent agents and tools that stop reporting progress fail early.
agent_turn_tool_extension_ms: 60000
agent_turn_max_timeout_ms: 1800000
agent_turn_stall_timeout_ms: 300000
agent_tool_timeout_ms: 600000
agent_input_timeout_ms: 300000
worker_idle_timeout_ms: 1800000
approval_timeout_ms: 300000

media:
  max_inbound_bytes: 20971520
  max_outbound_bytes: 52428800
  auto_discovery: false
  # Keep this aligned with the exact workspace(s) agents may export from.
  outbound_roots:
    - ..

delivery:
  full_tool_output: false
  tool_status_mode: all
  tool_status_batch_ms: 0
  # Collect pre-tool assistant messages until 10s of quiet, but never make the
  # first pending checkpoint wait more than 30s. Cap progress chat volume.
  checkpoint_batch_ms: 10000
  checkpoint_max_wait_ms: 30000
  checkpoint_max_digests_per_turn: 3
  checkpoint_max_chars: 1000
  send_timeout_ms: 30000
  queue_ttl_ms: 300000
  retention_ms: 2592000000

audit:
  max_bytes: 10485760
  max_files: 5

users:
  local:
    telegram_ids:
      - "123456789"
    wechat_ids:
      - "wechat-user-id"
    allowed_roots:
      - ..

channels:
  fake:
    enabled: true
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    allowed_chat_ids:
      - "123456789"
    unsafe_allow_all: false
  wechat:
    enabled: false
    allowed_chat_ids:
      - "wechat-user-id"
    bot_type: "3"
    send_min_interval_ms: 4000
    failure_cooldown_ms: 60000
    unsafe_allow_all: false

agents:
  pi:
    command: pi
    config_scope: system
    credential_isolation: required
    # system reuses one writable Pi config identity and therefore supports one
    # configured principal only. Required credential isolation disables caller-
    # supplied extensions/resources and exposes only the guarded tools below.
    # Use config_scope:hitch plus credential_isolation:required for multiple users.
    # system_config_root: ~/.pi/agent
    # Set once, after backup, when assigning legacy shared config_scope:hitch state.
    # legacy_state_principal: alice
    # Provider credentials are opt-in; channel credentials and host-control variables are rejected.
    # env_allowlist: [OPENAI_API_KEY]
    execution_policy:
      filesystem: workspace-write
      mounts: []
      tools: [read, write, edit, ls, hitch_send_media]
      process: false
      agent_network: allow
      sandbox: required
    default_args:
      - --mode
      - rpc
