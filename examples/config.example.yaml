data_dir: .remote-agent-hub
default_cwd: ..
agent_turn_timeout_ms: 300000
worker_idle_timeout_ms: 1800000
approval_timeout_ms: 300000

media:
  max_inbound_bytes: 20971520
  max_outbound_bytes: 52428800
  auto_discovery: false
  outbound_roots: []

delivery:
  full_tool_output: false
  tool_status_mode: all
  tool_status_batch_ms: 0
  send_timeout_ms: 30000
  queue_ttl_ms: 300000
  retention_ms: 2592000000

audit:
  max_bytes: 10485760
  max_files: 5

users:
  local:
    telegram_ids:
      - "123456789"
    wechat_ids:
      - "wechat-user-id"
    allowed_roots:
      - ..

channels:
  fake:
    enabled: true
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    allowed_chat_ids:
      - "123456789"
    unsafe_allow_all: false
  wechat:
    enabled: false
    allowed_chat_ids:
      - "wechat-user-id"
    bot_type: "3"
    send_min_interval_ms: 4000
    failure_cooldown_ms: 60000
    unsafe_allow_all: false

agents:
  pi:
    command: pi
    config_scope: system
    # system reuses one writable Pi config identity and therefore supports one
    # configured principal only. Pi may persistently change settings, trust,
    # credentials, packages, and extensions there. Use hitch for multiple users.
    # system_config_root: ~/.pi/agent
    # Set once, after backup, when assigning legacy shared config_scope:hitch state.
    # legacy_state_principal: alice
    # Provider credentials are opt-in; channel credentials and host-control variables are rejected.
    # env_allowlist: [OPENAI_API_KEY]
    execution_policy:
      filesystem: workspace-write
      mounts: []
      tools: [read, write, edit, grep, find, ls]
      process: false
      agent_network: allow
      sandbox: required
    default_args:
      - --mode
      - rpc
    default_policy: ask
