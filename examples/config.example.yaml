data_dir: .remote-agent-hub
default_cwd: ..
agent_turn_timeout_ms: 60000

users:
  local:
    telegram_ids:
      - "123456789"
    allowed_roots:
      - ..

channels:
  fake:
    enabled: true
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    allowed_chat_ids:
      - "123456789"
    unsafe_allow_all: false

agents:
  pi:
    command: pi
    config_scope: system
    default_args:
      - --mode
      - rpc
    default_policy: ask
