data_dir: .remote-agent-hub
default_cwd: ..
agent_turn_timeout_ms: 300000
worker_idle_timeout_ms: 1800000
approval_timeout_ms: 300000

media:
  max_inbound_bytes: 20971520
  max_outbound_bytes: 52428800
  auto_discovery: false
  outbound_roots: []

delivery:
  full_tool_output: false
  tool_status_mode: all
  tool_status_batch_ms: 0
  send_timeout_ms: 30000

users:
  local:
    telegram_ids:
      - "123456789"
    wechat_ids:
      - "wechat-user-id"
    allowed_roots:
      - ..

channels:
  fake:
    enabled: true
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    allowed_chat_ids:
      - "123456789"
    unsafe_allow_all: false
  wechat:
    enabled: false
    allowed_chat_ids:
      - "wechat-user-id"
    bot_type: "3"
    send_min_interval_ms: 4000
    failure_cooldown_ms: 60000
    unsafe_allow_all: false

agents:
  pi:
    command: pi
    config_scope: system
    default_args:
      - --mode
      - rpc
    default_policy: ask
